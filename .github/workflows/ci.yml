name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
      - run: mbx --version
      - run: mbx cache dir

  final:
    permissions: {}
    needs: [action, test]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - if: needs.action.result != 'success' || needs.test.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"
