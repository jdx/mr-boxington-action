name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: mbx
        uses: ./
      - run: mbx --version
      - run: mbx cache dir
      # The toolchain segment is what keeps one toolchain's store off another's
      # key, so assert the generated key actually carries one on every runner.
      - name: Check the cache key is scoped by toolchain
        env:
          PRIMARY_KEY: ${{ steps.mbx.outputs.cache-primary-key }}
        # A block scalar, because a plain one cannot hold the `: ` this
        # command's failure message would otherwise put in it.
        run: |
          node -e "const k = process.env.PRIMARY_KEY; if (!/-mbx-[^-]+-(rust-[0-9a-f]{12}|norust)-/.test(k)) { console.error('cache key is not scoped by toolchain: ' + k); process.exit(1) }"
      - name: Check native link cache policy
        run: node -e "if ((process.platform === 'linux') !== (process.env.MBX_CACHE_LINKS === '1')) process.exit(1)"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          backend: server
          server-url: https://cache.example.com
          namespace: action/smoke-test
          oidc-audience: mbx-cache
      - name: Check exported configuration
        run: |
          test "$MBX_REMOTE_URL" = https://cache.example.com
          test "$MBX_REMOTE_NAMESPACE" = action/smoke-test
          test "$MBX_REMOTE_OIDC_AUDIENCE" = mbx-cache
          test "$MBX_REMOTE_MODE" = read-write
          mbx --version

  final:
    permissions: {}
    needs: [action, server, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override cancellation and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check CI job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs completed successfully"
