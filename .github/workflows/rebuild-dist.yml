name: rebuild-dist

# Renovate bumps change what esbuild bundles into dist/index.js, so its PRs
# fail the `git diff --exit-code -- dist` check in ci.yml. This workflow
# rebuilds the bundle and pushes it to the Renovate branch.
#
# The build job runs dependency code and has no token. Only the push job holds
# the GitHub App token, and it never runs npm: it copies the built bundle out
# of an artifact and commits it.

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository == 'jdx/mr-boxington-action'
      && github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check whether dist changed
        id: diff
        run: |
          if git diff --quiet -- dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/index.js
          if-no-files-found: error
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DIST_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DIST_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Commit the rebuilt bundle
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          changed=$(git status --porcelain)
          if [[ "$changed" != " M dist/index.js" ]]; then
            echo "::error::Expected only dist/index.js to change, got:"
            echo "$changed"
            exit 1
          fi
          git config user.name "mbx-dist-bot[bot]"
          git config user.email "mbx-dist-bot[bot]@users.noreply.github.com"
          git commit -m "chore(deps): rebuild dist" -- dist/index.js
          # Fails as a non-fast-forward if Renovate moved the branch since the
          # build ran; the next pull_request run rebuilds from the new head.
          git push origin "HEAD:refs/heads/${HEAD_REF}"
