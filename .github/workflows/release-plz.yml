name: release-plz

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

# A run acts on the SHA it checked out: the default (one pending run, replaced by
# the newest) is wanted, so no `queue: max`.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    if: github.repository == 'jdx/mr-boxington-action'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Create or update the release PR
        run: mise run release-plz
        env:
          DRY_RUN: 0
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}
